<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Effet de texte avec GSAP</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f4;
      margin: 0;
    }
    #jobs {
      font-size: 2rem;
      font-weight: bold;
      color: #333;
      white-space: nowrap;
      overflow: hidden;
      border-right: 2px solid #333;
      width: 0; /* Initially hidden */
    }
  </style>
</head>
<body>
  <div id="jobs"></div>

  <script>
    const jobs = [
      "Développeur Frontend",
      "Système nuagique",
      "Administration système"
    ];

    const textElement = document.querySelector("#jobs");
    const typingSpeed = 0.2; // Speed of typing (seconds per character)
    const pauseTime = 1.1; // Pause time between jobss (seconds)
    const erasingSpeed = 0.10; // Speed of erasing (seconds per character)

    function typeText(jobs, callback) {
      gsap.to(textElement, {
        width: `${jobs.length}ch`,
        duration: jobs.length * typingSpeed,
        ease: "power1.out",
        onComplete: callback,
      });
    }

    function eraseText(callback) {
      gsap.to(textElement, {
        width: "0ch",
        duration: textElement.innerHTML.length * erasingSpeed,
        ease: "power1.in",
        onComplete: callback,
      });
    }

    function cycleTexts(index = 0) {
      textElement.innerHTML = jobs[index];
      typeText(jobs[index], () => {
        setTimeout(() => {
          eraseText(() => {
            cycleTexts((index + 1) % jobs.length);
          });
        }, pauseTime * 1100);
      });
    }

    // Start the animation
    cycleTexts();
  </script>
</body>
</html>
